<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Madness in Motion | One Body Colorado</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --wish-blue: #0057B8; 
            --neon-orange: #FF6B00; 
            --deep-bg: #0a0a0a; 
            --card-bg: #161616;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--deep-bg); 
            color: white; 
            margin: 0; 
            padding: 0;
            overflow-x: hidden;
        }

        /* Animated Gradient Header */
        .header { 
            background: white; 
            padding: 15px; 
            text-align: center;
            border-bottom: 4px solid var(--wish-blue);
            box-shadow: 0 4px 15px rgba(0,87,184,0.3);
        }
        .header img { height: 35px; }

        .hero { 
            padding: 60px 20px; 
            background: linear-gradient(135deg, rgba(0,87,184,0.4) 0%, rgba(0,0,0,1) 100%);
            border-bottom: 2px solid #333;
        }

        h1 { 
            font-family: 'Archivo Black', sans-serif; 
            font-size: 3.5rem; 
            margin: 0; 
            text-transform: uppercase; 
            line-height: 0.8;
            font-style: italic;
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        .sub-head { 
            color: var(--neon-orange); 
            font-weight: 900; 
            margin-top: 15px; 
            font-size: 1.1rem; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container { padding: 25px; max-width: 450px; margin: auto; }
        
        /* Glassmorphism Stat Card */
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 25px; 
            border: 1px solid #333; 
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .goal-text { 
            font-size: 0.8rem; 
            font-weight: 900; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between;
            color: #888;
            text-transform: uppercase;
        }

        .progress-bg { 
            background: #222; 
            height: 24px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #333;
        }

        .progress-fill { 
            background: linear-gradient(90deg, var(--wish-blue), #00c6ff); 
            width: 45%; 
            height: 100%; 
            box-shadow: 0 0 20px rgba(0,87,184,0.6);
            border-radius: 12px;
        }

        #timer { 
            font-family: 'Archivo Black', sans-serif;
            font-size: 2.2rem; 
            font-weight: 900; 
            margin-top: 20px; 
            color: white;
            letter-spacing: -1px;
        }

        /* Cool Pulse Button */
        .btn { 
            display: block; 
            background: var(--wish-blue); 
            color: white; 
            text-decoration: none; 
            padding: 22px; 
            border-radius: 18px; 
            font-weight: 900; 
            font-size: 1.4rem; 
            margin: 25px 0; 
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,87,184,0.4);
            border: none;
        }

        .btn:active { transform: scale(0.96); background: var(--neon-orange); }

        .prize-row {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .prize-box {
            background: #111;
            padding: 15px;
            border-radius: 15px;
            width: 40%;
            border: 1px solid #222;
        }

        .prize-box h3 { font-size: 0.7rem; color: var(--neon-orange); margin: 0 0 5px 0; text-transform: uppercase; }
        .prize-box p { font-size: 0.9rem; font-weight: 700; margin: 0; }

        .footer { 
            padding: 60px 20px; 
            font-size: 0.75rem; 
            color: #444; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

    </div>

    <div class="hero">
        <div class="sub-head">One Body Colorado</div>
        <h1>MADNESS<br>IN MOTION</h1>
    </div>

            <div class="goal-text"><span>Donation Progress</span> <span>$225 / $500</span></div>
